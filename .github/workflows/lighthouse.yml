name: Lighthouse CI Quality Gates

on:
  push:
    branches:
      - main
    paths: &lighthouse_paths
      - "index.html"
      - "style.css"
      - "script.js"
      - "sw.js"
      - "manifest.json"
      - "manifest.webmanifest"
      - "assets/**"
      - "src/**"
      - "client/**"
      - "data/projects.json"
      - "projects/productivity/advanced-qr-code-generator/**"
      - "projects/dev-tools/json-tree-viewer/**"
      - "projects/games/2048-game/**"
      - "package.json"
      - "package-lock.json"
      - ".nvmrc"
      - ".lighthouserc.json"
      - ".github/workflows/lighthouse.yml"

  pull_request:
    branches:
      - main
    paths: *lighthouse_paths

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lighthouse-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Audit Performance, A11y, Best Practices & SEO
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Lighthouse CI quality gates
        run: npm run lhci
        env:
          LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ github.sha }}
          LHCI_BUILD_CONTEXT__GITHUB_REPO_SLUG: ${{ github.repository }}

      - name: Upload Lighthouse HTML & JSON reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-ci-reports
          path: .lighthouseci/
          retention-days: 14
