name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --prefer-offline || npm install
      - run: npm run check-format
      - run: npm run validate:architecture
      - run: npm run validate:projects-sync
      # Warning mode: reports mini-contract problems but never fails the job.
      - run: npm run validate:mini-contract
      - run: npm run validate:worker-integrity
      - run: npm run check:links
      - run: npm run audit:deps
      - run: npm test
