name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci --prefer-offline || npm install
      - run: npm test
      - run: npm run generate
      - run: git diff --exit-code data/projects.json
