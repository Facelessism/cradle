<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>

    <filter id="auroraGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="80" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#bgGrad)" />

  <circle cx="250" cy="200" r="300" fill="#2563eb" opacity="0.28" filter="url(#auroraGlow)" />
  <circle cx="950" cy="450" r="350" fill="#16a34a" opacity="0.22" filter="url(#auroraGlow)" />

  <g opacity="0.1" fill="none" stroke="#2563eb" stroke-width="2">
    <path d="M -100,200 L 1300,550 M -100,250 L 1300,600 M -100,150 L 1300,500" />
    <path d="M 200,-100 L 550,800 M 250,-100 L 600,800 M 150,-100 L 500,800" />
    <path d="M 800,-100 L 1150,800 M 850,-100 L 1200,800 M 750,-100 L 1100,800" />
  </g>

  <rect x="25" y="25" width="1150" height="625" rx="20" fill="none" stroke="#2563eb" stroke-opacity="0.25" stroke-width="2" />

  <path d="M 25 100 L 25 45 A 20 20 0 0 1 45 25 L 100 25" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round" />
  <path d="M 1175 575 L 1175 630 A 20 20 0 0 1 1155 650 L 1100 650" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round" />

  <rect x="75" y="75" width="1050" height="525" rx="16" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" filter="url(#cardShadow)" />

  <g transform="translate(100, 130)">
    <rect width="130" height="40" rx="20" fill="#2563eb" fill-opacity="0.2" stroke="#2563eb" stroke-opacity="0.4" stroke-width="1.5" />
    <text x="65" y="24" font-family="'Space Grotesk', Inter, system-ui, sans-serif" font-size="12" font-weight="800" fill="#ffffff" fill-opacity="0.9" letter-spacing="2" text-anchor="middle">DEV-TOOLS</text>
  </g>

  <text x="100" y="320" font-family="'Space Grotesk', Inter, system-ui, sans-serif" font-size="58" font-weight="800" fill="#ffffff" letter-spacing="-1.5">Feature Flag</text>
  <text x="100" y="390" font-family="'Space Grotesk', Inter, system-ui, sans-serif" font-size="58" font-weight="800" fill="#ffffff" letter-spacing="-1.5">Playground</text>

  <g transform="translate(1100, 560)" text-anchor="end">
    <text font-family="'Space Grotesk', Inter, system-ui, sans-serif" font-size="20" font-weight="800" fill="#ffffff" fill-opacity="0.45" letter-spacing="4">CRADLE</text>
    <text y="22" font-family="'Space Grotesk', Inter, system-ui, sans-serif" font-size="10" font-weight="600" fill="#ffffff" fill-opacity="0.25" letter-spacing="1">EXPERIMENT SHOWCASE</text>
  </g>
</svg>