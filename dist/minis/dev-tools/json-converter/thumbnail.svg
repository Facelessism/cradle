<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="100%" stop-color="#1e3a5f" />
    </linearGradient>

    <!-- Aurora Blur Filter -->
    <filter id="auroraGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="80" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Card Shadow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Base background -->
  <rect width="1200" height="675" rx="0" fill="url(#bgGrad)" />

  <!-- Aurora Glows -->
  <circle cx="200" cy="200" r="300" fill="#38bdf8" opacity="0.2" filter="url(#auroraGlow)" />
  <circle cx="1000" cy="450" r="350" fill="#818cf8" opacity="0.2" filter="url(#auroraGlow)" />

  <!-- Decorative Pattern -->
  <g opacity="0.08" fill="none" stroke="#38bdf8" stroke-width="2">
      <path d="M -100,200 L 1300,550 M -100,250 L 1300,600 M -100,150 L 1300,500" />
      <path d="M 200,-100 L 550,800 M 250,-100 L 600,800 M 150,-100 L 500,800" />
      <path d="M 800,-100 L 1150,800 M 850,-100 L 1200,800 M 750,-100 L 1100,800" />
    </g>

  <!-- Border Frame -->
  <rect x="25" y="25" width="1150" height="625" rx="20" fill="none" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="2" />

  <!-- Accent Corner Highlights -->
  <path d="M 25 100 L 25 45 A 20 20 0 0 1 45 25 L 100 25" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
  <path d="M 1175 575 L 1175 630 A 20 20 0 0 1 1155 650 L 1100 650" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />

  <!-- Glassmorphic Card Container -->
  <rect x="75" y="75" width="1050" height="525" rx="16" fill="#ffffff" fill-opacity="0.03" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1" filter="url(#cardShadow)" />

  <!-- Code Lines Decoration -->
  <g transform="translate(800, 110)" opacity="0.2" font-family="'JetBrains Mono', monospace" font-size="14" fill="#38bdf8">
    <text y="0">{</text>
    <text y="24">  "a": 1,</text>
    <text y="48">  "b": "c"</text>
    <text y="72">}</text>
    <text y="110">→</text>
    <text y="134">a: 1</text>
    <text y="158">b: c</text>
  </g>

  <!-- Arrow symbols decoration -->
  <g transform="translate(830, 270)" opacity="0.15" stroke="#38bdf8" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 0,0 L 60,0 M 50,-10 L 60,0 L 50,10" />
    <path d="M 0,40 L 60,40 M 50,30 L 60,40 L 50,50" />
    <path d="M 0,80 L 60,80 M 50,70 L 60,80 L 50,90" />
  </g>

  <!-- Format badges -->
  <g transform="translate(820, 385)" opacity="0.6">
    <rect x="0" y="0" width="70" height="32" rx="16" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1" />
    <text x="35" y="20" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle">YAML</text>

    <rect x="80" y="0" width="64" height="32" rx="16" fill="#818cf8" fill-opacity="0.15" stroke="#818cf8" stroke-opacity="0.3" stroke-width="1" />
    <text x="112" y="20" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="700" fill="#818cf8" text-anchor="middle">CSV</text>

    <rect x="154" y="0" width="64" height="32" rx="16" fill="#a7f3d0" fill-opacity="0.15" stroke="#a7f3d0" stroke-opacity="0.3" stroke-width="1" />
    <text x="186" y="20" font-family="'Inter', system-ui, sans-serif" font-size="12" font-weight="700" fill="#a7f3d0" text-anchor="middle">XML</text>
  </g>

  <!-- Category Badge -->
  <g transform="translate(100, 130)">
    <rect width="130" height="40" rx="20" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5" />
    <text x="65" y="24" font-family="'Space Grotesk', Inter, system-ui, sans-serif" font-size="12" font-weight="800" fill="#ffffff" fill-opacity="0.9" letter-spacing="2" text-anchor="middle">DEV-TOOLS</text>
  </g>

  <!-- Project Title -->
  <text x="100" y="330" font-family="'Space Grotesk', Inter, system-ui, sans-serif" font-size="64" font-weight="800" fill="#ffffff" letter-spacing="-1.5">JSON Converter</text>

  <!-- Watermark logo -->
  <g transform="translate(1100, 560)" text-anchor="end">
    <text font-family="'Space Grotesk', Inter, system-ui, sans-serif" font-size="20" font-weight="800" fill="#ffffff" fill-opacity="0.45" letter-spacing="4">CRADLE</text>
    <text y="22" font-family="'Space Grotesk', Inter, system-ui, sans-serif" font-size="10" font-weight="600" fill="#ffffff" fill-opacity="0.25" letter-spacing="1">EXPERIMENT SHOWCASE</text>
  </g>
</svg>
