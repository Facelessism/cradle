<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Wordle — Cradle</title>
    <meta name="description" content="A feature-rich Wordle clone game with animations and statistics." />
    <link rel="canonical" href="https://facelessism.github.io/cradle/projects/games/wordle-clone/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Wordle — Cradle" />
    <meta property="og:description" content="A feature-rich Wordle clone game with animations and statistics." />
    <meta property="og:url" content="https://facelessism.github.io/cradle/projects/games/wordle-clone/" />

        <link rel="icon" type="image/svg+xml" href="../../../assets/favicon.svg" />
<link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="game-container">
      <!-- COMPLETE GAME CARD -->
      <div class="game-card">
        <!-- Header -->
        <header class="game-header">
          <div></div>

          <div class="title-section">
            <span class="game-label">MINI GAME</span>

            <h1>Wordle</h1>

            <p>Guess the five-letter word in six attempts.</p>
          </div>

          <button
            class="theme-btn"
            id="themeBtn"
            aria-label="Toggle theme"
            title="Toggle theme"
          >
            ◐
          </button>
        </header>

        <!-- Game -->
        <div class="game-content">
          <!-- Stats -->
          <section class="game-info">
            <div>
              <span>Attempts</span>
              <strong id="attemptCounter">0 / 6</strong>
            </div>

            <div>
              <span>Status</span>
              <strong id="gameStatus" role="status" aria-live="polite"
                >Playing</strong
              >
            </div>
          </section>

          <!-- Word Grid -->
          <section class="word-grid" id="wordGrid">
            <div class="row">
              <div class="tile"></div>
              <div class="tile"></div>
              <div class="tile"></div>
              <div class="tile"></div>
              <div class="tile"></div>
            </div>

            <div class="row">
              <div class="tile"></div>
              <div class="tile"></div>
              <div class="tile"></div>
              <div class="tile"></div>
              <div class="tile"></div>
            </div>

            <div class="row">
              <div class="tile"></div>
              <div class="tile"></div>
              <div class="tile"></div>
              <div class="tile"></div>
              <div class="tile"></div>
            </div>

            <div class="row">
              <div class="tile"></div>
              <div class="tile"></div>
              <div class="tile"></div>
              <div class="tile"></div>
              <div class="tile"></div>
            </div>

            <div class="row">
              <div class="tile"></div>
              <div class="tile"></div>
              <div class="tile"></div>
              <div class="tile"></div>
              <div class="tile"></div>
            </div>

            <div class="row">
              <div class="tile"></div>
              <div class="tile"></div>
              <div class="tile"></div>
              <div class="tile"></div>
              <div class="tile"></div>
            </div>
          </section>

          <!-- Message -->
          <div
            class="message"
            id="message"
            role="status"
            aria-live="polite"
          ></div>

                    <!-- Keyboard -->
          <section class="keyboard">
            <div class="keyboard-row">
              <button
                data-key="Q"
                aria-label="Enter Q"
                title="Enter Q"
              >Q</button>
              <button
                data-key="W"
                aria-label="Enter W"
                title="Enter W"
              >W</button>
              <button
                data-key="E"
                aria-label="Enter E"
                title="Enter E"
              >E</button>
              <button
                data-key="R"
                aria-label="Enter R"
                title="Enter R"
              >R</button>
              <button
                data-key="T"
                aria-label="Enter T"
                title="Enter T"
              >T</button>
              <button
                data-key="Y"
                aria-label="Enter Y"
                title="Enter Y"
              >Y</button>
              <button
                data-key="U"
                aria-label="Enter U"
                title="Enter U"
              >U</button>
              <button
                data-key="I"
                aria-label="Enter I"
                title="Enter I"
              >I</button>
              <button
                data-key="O"
                aria-label="Enter O"
                title="Enter O"
              >O</button>
              <button
                data-key="P"
                aria-label="Enter P"
                title="Enter P"
              >P</button>
            </div>

            <div class="keyboard-row">
              <button
                data-key="A"
                aria-label="Enter A"
                title="Enter A"
              >A</button>
              <button
                data-key="S"
                aria-label="Enter S"
                title="Enter S"
              >S</button>
              <button
                data-key="D"
                aria-label="Enter D"
                title="Enter D"
              >D</button>
              <button
                data-key="F"
                aria-label="Enter F"
                title="Enter F"
              >F</button>
              <button
                data-key="G"
                aria-label="Enter G"
                title="Enter G"
              >G</button>
              <button
                data-key="H"
                aria-label="Enter H"
                title="Enter H"
              >H</button>
              <button
                data-key="J"
                aria-label="Enter J"
                title="Enter J"
              >J</button>
              <button
                data-key="K"
                aria-label="Enter K"
                title="Enter K"
              >K</button>
              <button
                data-key="L"
                aria-label="Enter L"
                title="Enter L"
              >L</button>
            </div>

            <div class="keyboard-row">

              <button
                class="wide-key"
                data-key="ENTER"
                aria-label="Submit word"
                title="Submit word"
              >
                ENTER
              </button>

              <button
                data-key="Z"
                aria-label="Enter Z"
                title="Enter Z"
              >Z</button>
              <button
                data-key="X"
                aria-label="Enter X"
                title="Enter X"
              >X</button>
              <button
                data-key="C"
                aria-label="Enter C"
                title="Enter C"
              >C</button>
              <button
                data-key="V"
                aria-label="Enter V"
                title="Enter V"
              >V</button>
              <button
                data-key="B"
                aria-label="Enter B"
                title="Enter B"
              >B</button>
              <button
                data-key="N"
                aria-label="Enter N"
                title="Enter N"
              >N</button>
              <button
                data-key="M"
                aria-label="Enter M"
                title="Enter M"
              >M</button>

              <button
                class="wide-key"
                data-key="BACKSPACE"
                aria-label="Backspace"
                title="Backspace"
              >
                ←
              </button>

            </div>
          </section>

          <!-- Restart -->
          <button
            class="restart-btn"
            id="restartBtn"
            aria-label="Play again"
            title="Play again"
          >
            Play Again
          </button>
        </div>
      </div>
    </main>

    <script src="script.js"></script>
    <script
      src="../../../src/components/ui/BackToHome/BackToHome.js"
      defer
    ></script>
  </body>
</html>
