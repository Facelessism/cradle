<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dot Game</title>
  <meta name="description" content="Connect dots strategy game featuring custom grid settings, player scores, and match statistics.">
    <link rel="canonical" href="https://facelessism.github.io/cradle/projects/games/dot-game/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Dot Game" />
    <meta property="og:description" content="Connect dots strategy game featuring custom grid settings, player scores, and match statistics." />
    <meta property="og:url" content="https://facelessism.github.io/cradle/projects/games/dot-game/" />
      <link rel="icon" type="image/svg+xml" href="../../../assets/favicon.svg" />
<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    integrity="sha512-9usAa10I0ROHhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg=="
    crossorigin="anonymous"
  >
  <link rel="stylesheet" href="../../../src/components/ui/tokens.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header class="card" data-cradle-card>
      <div class="header-top">
        <div class="header-titles">
          <h1>Dot Game</h1>
          <p>Build, Explode, Conquer</p>
        </div>
        <button id="themeToggle" class="theme-toggle-btn" type="button" aria-label="Toggle theme" aria-pressed="false">
          <i class="fas fa-moon" aria-hidden="true"></i>
        </button>
      </div>
    </header>

    <section class="card controls" aria-label="Game controls">
      <div class="control-group">
        <label for="gameMode">Mode</label>
        <select id="gameMode">
          <option value="pvp" selected>Player vs Player</option>
          <option value="pvai">Player vs AI</option>
        </select>
      </div>

      <div class="control-group" id="difficultyGroup">
        <label for="difficulty">Difficulty</label>
        <select id="difficulty">
          <option value="easy">Easy</option>
          <option value="medium">Medium</option>
          <option value="hard" selected>Hard</option>
        </select>
      </div>

      <div class="control-group">
        <label for="playerCount">Players</label>
        <select id="playerCount">
          <option value="2">2 Players</option>
          <option value="3">3 Players</option>
          <option value="4" selected>4 Players</option>
        </select>
      </div>

      <div class="control-group">
        <label for="gridPreset">
          Grid Size:
          <span id="gridValue">8 × 8</span>
        </label>
        <select id="gridPreset">
          <option value="3">3 × 3</option>
          <option value="5">5 × 5</option>
          <option value="8" selected>8 × 8</option>
          <option value="custom">Custom</option>
        </select>
        <input id="gridCustom" type="number" min="2" max="12" value="10" placeholder="2-12" aria-label="Custom grid size" hidden>
      </div>

      <button id="newGame" class="btn" type="button">New Game</button>
      <button id="hintBtn" class="btn" type="button">Hint</button>
    </section>

    <section class="card status-bar" aria-live="polite">
      <span>Turn:</span>
      <span id="currentPlayer">Red</span>
    </section>

    <section id="boardWrapper" class="card" aria-label="Game board">
      <div id="board" role="grid" aria-label="Dot Game board"></div>
    </section>

    <section class="card" data-cradle-card data-title="Player Stats">
      <div id="playerStats"></div>
    </section>

    <section class="card analytics-section" data-cradle-card data-title="Match Analytics">
      <div id="analyticsContainer">
        <p class="empty-state">No completed games yet.</p>
      </div>
    </section>
  </main>

  <script src="../../../src/components/ui/Button/Button.js"></script>
  <script src="../../../src/components/ui/Card/Card.js"></script>
  <script src="../../../src/components/ui/BackToHome/BackToHome.js" defer></script>
  
  <script src="../../../scripts/theme.js"></script>
  
  <script src="dotGameEngine.js"></script>
  <script src="script.js"></script>
</body>
</html>
