<!-- src/minis/color-contrast-checker/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Contrast Checker — Cradle Mini</title>
    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="../../src/components/ui/tokens.css">
</head>
<body class="bg-slate-50 text-slate-900">
    
    <header class="p-4 border-b border-slate-200">
        <a href="../../index.html" class="text-sm font-semibold text-indigo-600 hover:underline">← Back to Archive</a>
    </header>

    <!-- Semantic Main Landmark (#622) -->
    <main id="main-content" class="max-w-4xl mx-auto p-6 space-y-6">
        <section class="space-y-2">
            <h1 class="text-2xl font-bold">Color Contrast Checker</h1>
            <p class="text-slate-600">Verify accessibility compliance (WCAG) for foreground and background color combinations.</p>
        </section>

        <div class="p-6 bg-white rounded-2xl shadow-sm border border-slate-200 space-y-4">
            <!-- Interactive Tool Content -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium mb-1">Foreground Color</label>
                    <input type="color" value="#000000" class="w-full h-10 rounded-lg cursor-pointer" />
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Background Color</label>
                    <input type="color" value="#ffffff" class="w-full h-10 rounded-lg cursor-pointer" />
                </div>
            </div>
            <div class="p-4 bg-slate-100 rounded-xl text-center font-semibold">
                Contrast Ratio: 21:1 (WCAG AAA Pass)
            </div>
        </div>
    </main>

    <footer class="text-center py-6 text-sm text-slate-500">
        <p>Part of the Cradle Project Archive</p>
    </footer>

</body>
</html>
