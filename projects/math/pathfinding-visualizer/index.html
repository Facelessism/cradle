<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pathfinding Visualizer | Cradle</title>
    <meta
      name="description"
      content="Compare A*, Dijkstra, and BFS on an interactive grid with adjustable speed, wall drawing, and animated shortest-path tracing."
    />
    <link
      rel="canonical"
      href="https://facelessism.github.io/cradle/projects/math/pathfinding-visualizer/"
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Pathfinding Visualizer | Cradle" />
    <meta
      property="og:description"
      content="Compare A*, Dijkstra, and BFS on an interactive grid with adjustable speed, wall drawing, and animated shortest-path tracing."
    />
    <meta
      property="og:url"
      content="https://facelessism.github.io/cradle/projects/math/pathfinding-visualizer/"
    />
    <link rel="icon" type="image/svg+xml" href="../../../assets/favicon.svg" />
    <link rel="stylesheet" href="style.css" />
    <script
      src="../../../src/components/ui/BackToHome/BackToHome.js"
      defer
    ></script>
  </head>

  <body>
    <main class="container">
      <header class="header">
        <h1>Pathfinding Algorithm Visualizer</h1>
        <p class="subtitle">
          Visualize A*, Dijkstra, BFS, Bidirectional A*, and Bidirectional Dijkstra with 4-way/8-way movement and multiple heuristics.
        </p>
      </header>

      <section class="controls">
        <div class="control-group">
          <label for="algorithm-select">Algorithm:</label>
          <select id="algorithm-select">
            <option value="astar">A* Search</option>
            <option value="dijkstra">Dijkstra's Algorithm</option>
            <option value="bfs">Breadth-First Search (BFS)</option>
            <option value="bidirectional-astar">Bidirectional A* Search</option>
            <option value="bidirectional-dijkstra">Bidirectional Dijkstra</option>
          </select>
        </div>
        <div class="control-group" id="heuristic-group">
          <label for="heuristic-select">Heuristic:</label>
          <select id="heuristic-select">
            <option value="manhattan" selected>Manhattan</option>
            <option value="euclidean">Euclidean</option>
            <option value="chebyshev">Chebyshev</option>
            <option value="octile">Octile</option>
          </select>
        </div>
        <div class="control-group" id="movement-group">
          <label for="movement-select">Movement:</label>
          <select id="movement-select">
            <option value="orthogonal" selected>4-Way (Orthogonal)</option>
            <option value="diagonal">8-Way (Diagonal)</option>
          </select>
        </div>
        <div class="control-group" id="corner-cutting-group">
          <label class="checkbox-label" for="corner-cutting-toggle">
            <input type="checkbox" id="corner-cutting-toggle" checked />
            Prevent Corner Cutting
          </label>
        </div>
        <div class="control-group">
          <label for="speed-select">Animation Speed:</label>
          <select id="speed-select">
            <option value="50">Fast</option>
            <option value="150" selected>Normal</option>
            <option value="300">Slow</option>
          </select>
        </div>
        <div class="control-group">
          <button id="btn-generate-maze" class="btn btn-secondary">
            Generate Random Maze
          </button>
          <button id="btn-clear-board" class="btn btn-secondary">
            Clear Board
          </button>
          <button id="btn-clear-walls" class="btn btn-secondary">
            Clear Walls Only
          </button>
          <button id="btn-clear-path" class="btn btn-secondary">
            Clear Path
          </button>
        </div>
        <div class="control-group">
          <button id="btn-visualize" class="btn btn-primary">Visualize!</button>
        </div>
      </section>

      <section class="legend">
        <div class="legend-item">
          <span class="box start"></span> Start Node
        </div>
        <div class="legend-item"><span class="box end"></span> End Node</div>
        <div class="legend-item"><span class="box wall"></span> Wall</div>
        <div class="legend-item"><span class="box visited visited-forward"></span> Visited (Forward)</div>
        <div class="legend-item"><span class="box visited visited-backward"></span> Visited (Backward)</div>
        <div class="legend-item">
          <span class="box path"></span> Shortest Path
        </div>
      </section>

      <div id="grid-container" class="grid-container"></div>

      <div id="status-message" class="status-message" aria-live="polite"></div>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
