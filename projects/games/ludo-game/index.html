<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludo — Premium Board Game</title>
    <meta name="description" content="A premium digital Ludo board game with Canvas rendering, smooth animations, and 3D dice.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="top-bar">
        <div class="logo">
            <span class="logo-icon">🎲</span>
            <h1>Ludo</h1>
        </div>
        <p id="status" class="status-badge" aria-live="polite" aria-atomic="true">Red's turn</p>
    </header>

    <main class="game-layout">
        <aside class="side-panel left-panel">
            <div class="panel-section">
                <h3 class="panel-title">Controls</h3>
                <button id="rollDice" class="btn btn-roll">
                    <span class="btn-icon">🎯</span> Roll Dice
                </button>
                <div class="dice-row">
                    <div id="diceValue" aria-live="polite" aria-atomic="true" style="position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border-width: 0;"></div>
                    <div class="scene">
                        <div class="cube" id="diceCube" aria-live="polite" aria-atomic="true">
                            <div class="cube-face cube-face-front">1</div>
                            <div class="cube-face cube-face-back">6</div>
                            <div class="cube-face cube-face-right">3</div>
                            <div class="cube-face cube-face-left">4</div>
                            <div class="cube-face cube-face-top">5</div>
                            <div class="cube-face cube-face-bottom">2</div>
                        </div>
                    </div>
                </div>
                <div class="btn-group">
                    <button id="newGame" class="btn btn-secondary">
                        <span class="btn-icon">🔄</span> New Game
                    </button>
                    <button id="backHome" class="btn btn-ghost">
                        <span class="btn-icon">🏠</span> Home
                    </button>
                </div>
            </div>

            <div class="panel-section">
                <h3 class="panel-title">Players</h3>
                <div class="player-list">
                    <div class="player-row active" data-color="red">
                        <div class="player-dot red"></div>
                        <span>Red</span>
                        <span class="player-type-icon" id="icon-red">👤</span>
                    </div>
                    <div class="player-row" data-color="green">
                        <div class="player-dot green"></div>
                        <span>Green</span>
                        <span class="player-type-icon" id="icon-green">🤖</span>
                    </div>
                    <div class="player-row" data-color="blue">
                        <div class="player-dot blue"></div>
                        <span>Blue</span>
                        <span class="player-type-icon" id="icon-blue">🤖</span>
                    </div>
                    <div class="player-row" data-color="yellow">
                        <div class="player-dot yellow"></div>
                        <span>Yellow</span>
                        <span class="player-type-icon" id="icon-yellow">🤖</span>
                    </div>
                </div>
            </div>
        </aside>

        <div class="board-container">
            <canvas id="ludoCanvas" width="600" height="600"></canvas>
        </div>
