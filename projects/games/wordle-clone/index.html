<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Wordle — Cradle</title>
    <meta name="description" content="A feature-rich Wordle clone game with animations and statistics." />
    <link rel="canonical" href="https://facelessism.github.io/cradle/projects/games/wordle-clone/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Wordle — Cradle" />
    <meta property="og:description" content="A feature-rich Wordle clone game with animations and statistics." />
    <meta property="og:url" content="https://facelessism.github.io/cradle/projects/games/wordle-clone/" />

        <link rel="icon" type="image/svg+xml" href="../../../assets/favicon.svg" />
<link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="game-container">
      <!-- COMPLETE GAME CARD -->
      <div class="game-card">
        <!-- Header -->
        <header class="game-header">
          <div></div>

          <div class="title-section">
            <span class="game-label">MINI GAME</span>

            <h1>Wordle</h1>

            <p>Guess the five-letter word in six attempts.</p>
          </div>

          <button class="theme-btn" id="themeBtn" aria-label="Toggle theme">
            ◐
          </button>
        </header>

        <!-- Game -->
        <div class="game-content">
          <!-- Stats -->
          <section class="game-info">
            <div>
              <span>Attempts</span>
              <strong id="attemptCounter">0 / 6</strong>
            </div>

            <div>
              <span>Status</span>
              <strong id="gameStatus" role="status" aria-live="polite"
                >Playing</strong
              >
            </div>
          </section>

          <!-- Word Grid -->
          <section class="word-grid" id="wordGrid">
            <div class="row">
              <div class="tile"></div>
              <div class="tile"></div>
              <div class="tile"></div>
              <div class="tile"></div>
              <div class="tile"></div>
            </div>

            <div class="row">
              <div class="tile"></div>
              <div class="tile"></div>
              <div class="tile"></div>
              <div class="tile"></div>
              <div class="tile"></div>
            </div>

            <div class="row">
              <div class="tile"></div>
              <div class="tile"></div>
              <div class="tile"></div>
              <div class="tile"></div>
              <div class="tile"></div>
            </div>

            <div class="row">
              <div class="tile"></div>
              <div class="tile"></div>
              <div class="tile"></div>
              <div class="tile"></div>
              <div class="tile"></div>
            </div>

            <div class="row">
              <div class="tile"></div>
              <div class="tile"></div>
              <div class="tile"></div>
              <div class="tile"></div>
              <div class="tile"></div>
            </div>

            <div class="row">
              <div class="tile"></div>
              <div class="tile"></div>
              <div class="tile"></div>
              <div class="tile"></div>
              <div class="tile"></div>
            </div>
          </section>

          <!-- Message -->
          <div
            class="message"
            id="message"
            role="status"
            aria-live="polite"
          ></div>

          <!-- Keyboard -->
          <section class="keyboard">
            <div class="keyboard-row">
              <button data-key="Q">Q</button>
              <button data-key="W">W</button>
              <button data-key="E">E</button>
              <button data-key="R">R</button>
              <button data-key="T">T</button>
              <button data-key="Y">Y</button>
              <button data-key="U">U</button>
              <button data-key="I">I</button>
              <button data-key="O">O</button>
              <button data-key="P">P</button>
            </div>

            <div class="keyboard-row">
              <button data-key="A">A</button>
              <button data-key="S">S</button>
              <button data-key="D">D</button>
              <button data-key="F">F</button>
              <button data-key="G">G</button>
              <button data-key="H">H</button>
              <button data-key="J">J</button>
              <button data-key="K">K</button>
              <button data-key="L">L</button>
            </div>

            <div class="keyboard-row">
              <button class="wide-key" data-key="ENTER">ENTER</button>

              <button data-key="Z">Z</button>
              <button data-key="X">X</button>
              <button data-key="C">C</button>
              <button data-key="V">V</button>
              <button data-key="B">B</button>
              <button data-key="N">N</button>
              <button data-key="M">M</button>

              <button
                class="wide-key"
                data-key="BACKSPACE"
                aria-label="Backspace"
              >
                ←
              </button>
            </div>
          </section>

          <!-- Restart -->
          <button class="restart-btn" id="restartBtn">Play Again</button>
        </div>
      </div>
    </main>

    <script src="script.js"></script>
    <script
      src="../../../src/components/ui/BackToHome/BackToHome.js"
      defer
    ></script>
  </body>
</html>
