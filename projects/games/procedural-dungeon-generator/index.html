<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procedural Dungeon Generator | Cradle</title>
    <link rel="icon" type="image/svg+xml" href="../../../assets/favicon.svg" />
    <link rel="stylesheet" href="style.css">
    <script src="../../../src/components/ui/BackToHome/BackToHome.js" defer></script>
</head>

<body>
    <main class="container">
        <header class="header">
            <h1>Procedural Dungeon Generator</h1>
            <p class="subtitle">Generate randomized tile-based dungeon layouts using Binary Space Partitioning (BSP).
            </p>
        </header>

        <section class="controls">
            <div class="control-group">
                <label for="map-width">Width:</label>
                <input type="number" id="map-width" value="40" min="20" max="100">
            </div>
            <div class="control-group">
                <label for="map-height">Height:</label>
                <input type="number" id="map-height" value="30" min="20" max="100">
            </div>
            <div class="control-group">
                <label for="min-room-size">Min Room Size:</label>
                <input type="number" id="min-room-size" value="4" min="3" max="10">
            </div>
            <div class="control-group">
                <label for="seed">Seed (Optional):</label>
                <input type="text" id="seed" placeholder="Random">
            </div>
            <div class="control-group">
                <button id="btn-generate" class="btn btn-primary">Generate New Dungeon</button>
            </div>
        </section>

        <div class="canvas-container">
            <canvas id="dungeon-canvas"></canvas>
        </div>

        <section class="legend">
            <div class="legend-item"><span class="box floor"></span> Floor</div>
            <div class="legend-item"><span class="box wall"></span> Wall</div>
            <div class="legend-item"><span class="box door"></span> Door</div>
            <div class="legend-item"><span class="box start"></span> Start</div>
            <div class="legend-item"><span class="box end"></span> End</div>
        </section>
    </main>
    <script type="module" src="controller.js"></script>
</body>

</html>
