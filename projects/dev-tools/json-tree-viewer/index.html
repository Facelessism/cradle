<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JSON Tree Viewer</title>
    <meta
      name="description"
      content="Interactive JSON viewer with collapsible tree, syntax highlighting, search, and path copying."
    />
    <link
      rel="canonical"
      href="https://facelessism.github.io/cradle/projects/dev-tools/json-tree-viewer/"
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="JSON Tree Viewer" />
    <meta
      property="og:description"
      content="Interactive JSON viewer with collapsible tree, syntax highlighting, search, and path copying."
    />
    <meta
      property="og:url"
      content="https://facelessism.github.io/cradle/projects/dev-tools/json-tree-viewer/"
    />
    <link rel="icon" type="image/svg+xml" href="../../../assets/favicon.svg" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="../../../src/components/ui/tokens.css" />
  </head>

  <body>
    <main class="viewer-shell">
      <header class="viewer-header">
        <div class="header-left">
          <p class="eyebrow">Developer tool</p>
          <h1>📋 JSON Tree Viewer</h1>
        </div>
        <div class="header-actions">
          <button id="expandAll" class="btn-action" title="Expand all nodes">
            🔽 Expand All
          </button>
          <button
            id="collapseAll"
            class="btn-action"
            title="Collapse all nodes"
          >
            🔼 Collapse All
          </button>
          <button id="copyPath" class="btn-action" title="Copy selected path">
            📋 Copy Path
          </button>
          <button id="copyJson" class="btn-action" title="Copy formatted JSON">
            📥 Copy JSON
          </button>
          <button id="loadSample" class="btn-action" title="Load sample data">
            🎲 Sample
          </button>
        </div>
      </header>

      <div class="viewer-body">
        <!-- Input Panel -->
        <div class="panel input-panel">
          <div class="panel-header">
            <h2>📝 Input</h2>
            <div class="panel-actions">
              <button id="formatBtn" class="btn-small">✨ Format</button>
              <button id="minifyBtn" class="btn-small">📦 Minify</button>
              <button id="clearBtn" class="btn-small btn-danger">
                🗑️ Clear
              </button>
            </div>
          </div>
          <textarea
            id="jsonInput"
            class="json-input"
            placeholder='Paste your JSON here...\n\nExample:\n{\n  "name": "Cradle",\n  "version": "1.0",\n  "features": ["viewer", "editor"]\n}'
            spellcheck="false"
          ></textarea>
          <div class="input-footer">
            <span
              id="inputStatus"
              class="status-badge status-idle"
              role="status"
              aria-live="polite"
              >Waiting for input</span
            >
            <span id="inputSize" class="input-size"></span>
          </div>
        </div>

        <!-- Tree Panel -->
        <div class="panel tree-panel">
          <div class="panel-header">
            <h2>🌳 Tree View</h2>
            <div class="panel-actions">
              <div class="search-box">
                <input
                  type="text"
                  id="searchInput"
                  placeholder="Search keys or values..."
                  class="search-input"
                />
                <button
                  id="clearSearch"
                  class="search-clear"
                  hidden
                  aria-label="Clear search"
                >
                  ✕
                </button>
              </div>
              <span id="searchCount" class="search-count" hidden></span>
            </div>
          </div>

          <!-- Real-Time JSONPath Filter Bar -->
          <div class="jsonpath-bar" id="jsonPathBar">
            <div class="jsonpath-input-group">
              <span class="jsonpath-icon" title="JSONPath Query Evaluator">💲</span>
              <input
                type="text"
                id="jsonPathInput"
                class="jsonpath-input"
                placeholder="JSONPath (e.g. $.store.book[*].author, $..price, $.features[0].name)..."
                spellcheck="false"
                autocomplete="off"
                aria-label="JSONPath Filter Query"
              />
              <button
                id="clearJsonPath"
                class="jsonpath-clear"
                hidden
                aria-label="Clear JSONPath query"
              >
                ✕
              </button>
              <span
                id="jsonPathBadge"
                class="jsonpath-badge badge-idle"
                role="status"
                aria-live="polite"
              >Ready</span>
              <div id="jsonPathNav" class="jsonpath-nav" hidden>
                <button id="prevMatchBtn" class="jsonpath-nav-btn" title="Previous match (Shift+Enter)" aria-label="Previous match">▲</button>
                <span id="matchIndexDisplay" class="jsonpath-match-index">1/1</span>
                <button id="nextMatchBtn" class="jsonpath-nav-btn" title="Next match (Enter)" aria-label="Next match">▼</button>
              </div>
            </div>
            <div class="jsonpath-presets">
              <span class="presets-label">Presets:</span>
              <button type="button" class="preset-chip" data-query="$.features[*].name">$.features[*].name</button>
              <button type="button" class="preset-chip" data-query="$..status">$..status</button>
              <button type="button" class="preset-chip" data-query="$.config.*">$.config.*</button>
              <button type="button" class="preset-chip" data-query="$..name">$..name</button>
              <button type="button" class="preset-chip" data-query="$.features[?(@.status == 'active')]">$.features[?(@.status == 'active')]</button>
            </div>
          </div>

          <div class="tree-container" id="treeContainer">
            <p class="tree-placeholder">Parse JSON to see the tree view</p>
          </div>
        </div>
      </div>

      <!-- Stats Bar -->
      <div class="stats-bar">
        <div class="stat-item">
          <span class="stat-label">Type</span>
          <span class="stat-value" id="statType">—</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Keys</span>
          <span class="stat-value" id="statKeys">0</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Depth</span>
          <span class="stat-value" id="statDepth">0</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Size</span>
          <span class="stat-value" id="statSize">0 B</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Path</span>
          <span class="stat-value stat-path" id="statPath" title="Click to copy"
            >—</span
          >
        </div>
      </div>

      <!-- Interactive Hover Tooltip for Real-Time Path & Subtree Copy -->
      <div id="treeHoverTooltip" class="tree-hover-tooltip" hidden role="tooltip" aria-hidden="true">
        <div class="tooltip-header">
          <span class="tooltip-tag">Code Reference</span>
          <code class="tooltip-codepath" id="tooltipCodePath">data</code>
        </div>
        <div class="tooltip-actions">
          <button type="button" class="tooltip-action-btn" id="tooltipCopyCodeBtn" title="Copy code path (e.g. data.users[0].address.city)">
            📋 Copy Path
          </button>
          <button type="button" class="tooltip-action-btn" id="tooltipCopyJsonPathBtn" title="Copy JSONPath (e.g. $.users[0].address.city)">
            💲 JSONPath
          </button>
          <button type="button" class="tooltip-action-btn" id="tooltipCopySubtreeBtn" title="Copy subtree JSON">
            📦 Copy Subtree
          </button>
        </div>
      </div>

      <!-- Toast -->
      <div class="toast" id="toast" hidden></div>
    </main>

    <script src="jsonPathEngine.js"></script>
    <script type="module" src="script.js"></script>
    <script
      src="../../../src/components/ui/BackToHome/BackToHome.js"
      defer
    ></script>
  </body>
</html>
