<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Morse Code Studio</title>
    <meta
      name="description"
      content="Interactive Morse code studio for encoding, decoding, audio playback, and speed tuning."
    />
    <link rel="canonical" href="https://facelessism.github.io/cradle/projects/misc/morse-code-studio/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Morse Code Studio" />
    <meta property="og:description" content="Interactive Morse code studio for encoding, decoding, audio playback, and speed tuning." />
    <meta property="og:url" content="https://facelessism.github.io/cradle/projects/misc/morse-code-studio/" />
    <link rel="stylesheet" href="style.css" />
        <link rel="icon" type="image/svg+xml" href="../../../assets/favicon.svg" />
</head>
  <body>
    <div class="container">
      <header>
        <h1>📡 Morse Code Studio</h1>
        <p>Encode text, decode Morse code, and play Morse audio.</p>
      </header>

      <main role="main">
        <div class="editor-grid">
          <section class="editor">
            <label for="inputText">Plain Text</label>
            <textarea
              id="inputText"
              placeholder="Enter text to encode..."
              autocomplete="off"
              spellcheck="true"
            ></textarea>
          </section>

          <section class="editor">
            <label for="outputText">Morse Code</label>
            <textarea
              id="outputText"
              placeholder="Enter Morse code to decode..."
              autocomplete="off"
              spellcheck="false"
            ></textarea>
          </section>
        </div>

        <div class="toolbar" aria-label="Morse code controls">
          <button id="encodeBtn" type="button">Encode →</button>
          <button id="decodeBtn" type="button">← Decode</button>
          <button id="playBtn" type="button">▶ Play</button>
          <button id="copyBtn" type="button">📋 Copy</button>
          <button id="clearBtn" type="button">🗑 Clear</button>
        </div>

        <section class="card" aria-labelledby="speed-label">
          <div class="speed-header">
            <label id="speed-label" for="speedSlider">Playback Speed</label>
            <span id="speedValue">20 WPM</span>
          </div>

          <input
            type="range"
            id="speedSlider"
            min="5"
            max="60"
            value="20"
            step="1"
            aria-labelledby="speed-label"
          />
        </section>
      </main>
    </div>

    <script src="morseEngine.js"></script>
    <script src="script.js"></script>
    <script
      src="../../../src/components/ui/BackToHome/BackToHome.js"
      defer
    ></script>
  </body>
</html>
