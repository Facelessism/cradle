<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Advanced QR Code Generator — Vector & Raster Export</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="qr-app">
    <header class="qr-header">
      <a href="../../../index.html" class="back-link">← Back to Cradle</a>
      <h1>Advanced QR Code Generator</h1>
      <p>
        Generate resolution-independent SVG vector QR codes with crisp module
        geometry and high-DPI raster export.
      </p>
    </header>

    <section class="qr-workspace" aria-label="QR Generator Workspace">
      <form id="qr-form" class="qr-controls" novalidate>
        <div class="control-group">
          <label for="qr-input">Content or URL</label>
          <textarea id="qr-input" rows="3" placeholder="https://cradle-zeta.vercel.app"
            required>https://cradle-zeta.vercel.app</textarea>
        </div>

        <div class="control-row">
          <div class="control-group">
            <label for="module-style">Module Geometry</label>
            <select id="module-style">
              <option value="square" selected>Sharp Square (Merged Path)</option>
              <option value="rounded">Rounded Modules</option>
              <option value="dots">Circular Dots</option>
            </select>
          </div>

          <div class="control-group">
            <label for="quiet-zone">Quiet Zone (Modules)</label>
            <input id="quiet-zone" type="number" min="0" max="10" value="4" />
          </div>
        </div>

        <div class="control-row">
          <div class="control-group">
            <label for="fg-color">Foreground Color</label>
            <input id="fg-color" type="color" value="#0f172a" />
          </div>

          <div class="control-group">
            <label for="bg-color">Background Color</label>
            <input id="bg-color" type="color" value="#ffffff" />
          </div>
        </div>

        <div class="control-row">
          <div class="control-group">
            <label for="export-size">Export Dimensions (px)</label>
            <select id="export-size">
              <option value="256">256 × 256</option>
              <option value="512" selected>512 × 512</option>
              <option value="1024">1024 × 1024</option>
              <option value="2048">2048 × 2048</option>
            </select>
          </div>

          <div class="control-group checkbox-group">
            <label for="transparent-bg">
              <input id="transparent-bg" type="checkbox" />
              Transparent Background
            </label>
          </div>
        </div>
      </form>

      <div class="qr-preview-panel">
        <div id="qr-preview-stage" class="qr-preview-stage" aria-live="polite"></div>

        <div class="qr-meta" id="qr-meta">
          Vector SVG • Crisp Edges Enabled
        </div>

        <div class="export-actions">
          <button type="button" id="download-svg-btn" class="btn btn-primary">
            Download SVG (Vector)
          </button>
          <button type="button" id="copy-svg-btn" class="btn btn-secondary">
            Copy SVG Markup
          </button>
          <button type="button" id="download-png-btn" class="btn btn-secondary">
            Download PNG (Raster)
          </button>
        </div>

        <p id="status-banner" class="status-banner" role="status"></p>
      </div>
    </section>
  </main>

  <script type="module" src="script.js"></script>
</body>

</html>
